<!DOCTYPE html>
<html><body style="font-family:sans-serif;max-width:480px;margin:60px auto">
<h2>Deploy a New Project</h2>
<form id="f">
  <input name="project_name" placeholder="project-name" required><br><br>
  <input name="email" type="email" placeholder="you@example.com" required><br><br>
  <button type="submit">Submit</button>
</form>
<p id="msg"></p>
<script>
const f = document.getElementById('f'), msg = document.getElementById('msg');
f.onsubmit = async e => {
  e.preventDefault();
  msg.textContent = 'Submitting...';
  const r = await fetch('/submit', {method:'POST', body:new FormData(f)});
  const d = await r.json();
  if (!r.ok) { msg.textContent = d.error; return; }
  const t = setInterval(async () => {
    const s = await (await fetch('/status?queue_id=' + d.queue_id)).json();
    msg.textContent = 'Status: ' + s.state;
    if (s.state === 'SUCCESS') {
      clearInterval(t);
      msg.textContent = 'Deployed: ';
      const a = document.createElement('a');
      a.href = s.url; a.target = '_blank'; a.textContent = s.url;
      msg.appendChild(a);
    } else if (['FAILURE','ABORTED','CANCELLED','UNKNOWN'].includes(s.state)) {
      clearInterval(t);
      msg.textContent = 'Deployment ended: ' + s.state;
    }
  }, 3000);
};
</script></body></html>
