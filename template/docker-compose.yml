services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASS: ${DB_PASS}
      PROJECT_NAME: ${PROJECT_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  frontend:
    build: ./frontend
    ports:
      - "80"
    depends_on: [backend]
    networks: [internal]

volumes:
  db_data:
networks:
  internal:
